# Apache VirtualHost para suprema.eti.br - Next.js Reverse Proxy
# Painel: aaPanel/BT Panel (Apache em /www/server/apache/)
# Copie para: /www/server/panel/vhost/apache/suprema.eti.br.conf
# Depois: Recarregue o Apache no painel ou: /www/server/apache/bin/apachectl graceful

# ============================================
# Diretório de logs do aaPanel
# ============================================
Define APACHE_LOG_DIR /www/server/apache/logs

# ============================================
# HTTP (80) -> Redireciona para HTTPS
# ============================================
<VirtualHost *:80>
    ServerName suprema.eti.br
    ServerAlias www.suprema.eti.br

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/suprema.eti.br-http-error.log
    CustomLog ${APACHE_LOG_DIR}/suprema.eti.br-http-access.log combined

    # Redireciona todo tráfego HTTP para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ============================================
# HTTPS (443) - Reverse Proxy para Next.js (porta 3000)
# ============================================
<VirtualHost *:443>
    ServerName suprema.eti.br
    ServerAlias www.suprema.eti.br

    # ============================================
    # SSL/TLS (Let's Encrypt - caminhos do aaPanel)
    # ============================================
    SSLEngine on
    SSLCertificateFile /www/server/panel/vhost/cert/suprema.eti.br/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/suprema.eti.br/privkey.pem

    # Configurações SSL modernas
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    SSLUseStapling on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # ============================================
    # Headers de Segurança
    # ============================================
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';"

    # ============================================
    # Proxy Reverso para Next.js
    # ============================================
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyVia Off
    ProxyTimeout 300
    ProxyBadHeader Ignore
    ProxyIOBufferSize 8192

    # ============================================
    # WebSocket Support
    # ============================================
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:3000/$1 [P,L]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule /(.*) ws://localhost:3000/$1 [P,L]

    # ============================================
    # Proxy Principal
    # ============================================
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Headers essenciais para Next.js
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}e"

    # ============================================
    # Compressão
    # ============================================
    SetOutputFilter DEFLATE
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|ico|svg|woff2?)$ no-gzip dont-vary
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml application/rss+xml

    # ============================================
    # Cache para assets estáticos do Next.js
    # ============================================
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
    </LocationMatch>

    <LocationMatch "^/(images|img|assets|media)/">
        Header set Cache-Control "public, max-age=86400"
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
    </LocationMatch>

    # ============================================
    # Logs
    # ============================================
    ErrorLog ${APACHE_LOG_DIR}/suprema.eti.br-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/suprema.eti.br-ssl-access.log combined

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D %{X-Forwarded-For}i" proxy_combined
    CustomLog ${APACHE_LOG_DIR}/suprema.eti.br-proxy.log proxy_combined
</VirtualHost>